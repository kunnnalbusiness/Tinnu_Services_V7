<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fox-grad-top" x1="20" y1="10" x2="80" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="50%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#e63900" />
    </linearGradient>

    <linearGradient id="fox-grad-main" x1="25" y1="20" x2="75" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff9d00" />
      <stop offset="50%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#cc2200" />
    </linearGradient>

    <linearGradient id="fox-grad-ear-inner" x1="32" y1="12" x2="48" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff2d6" />
      <stop offset="60%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#ff7b00" />
    </linearGradient>

    <linearGradient id="fox-grad-chest" x1="20" y1="50" x2="55" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffede0" />
      <stop offset="100%" stop-color="#ffd4b3" />
    </linearGradient>

    <linearGradient id="fox-grad-back" x1="45" y1="15" x2="85" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8a1c00" />
      <stop offset="40%" stop-color="#d93800" />
      <stop offset="100%" stop-color="#ff6a00" />
    </linearGradient>

    <linearGradient id="fox-grad-swoop" x1="30" y1="55" x2="85" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="40%" stop-color="#ff4400" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <filter id="fox-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#ff6200" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#fox-glow)">
    <!-- Back Ear -->
    <path d="M 32 8 L 47 32 C 41 33 34 25 32 8 Z" fill="url(#fox-grad-back)" />
    <!-- Back Ear Inner Highlight -->
    <path d="M 34 11 L 43 29 C 39 29 35 23 34 11 Z" fill="url(#fox-grad-ear-inner)" />

    <!-- Front Ear -->
    <path d="M 22 16 C 30 14 43 20 48 37 C 38 33 28 25 22 16 Z" fill="url(#fox-grad-top)" />

    <!-- Back Head / Mane Layers -->
    <path d="M 45 26 C 60 22 78 30 87 52 C 80 49 73 46 66 42 C 75 49 83 60 82 72 C 70 54 58 44 45 40 Z" fill="url(#fox-grad-back)" />

    <!-- Main Head / Forehead / Snout -->
    <path d="M 42 33 C 31 35 27 46 19 60 C 22 61 25 60 28 58 C 23 62 20 64 17 64 C 23 52 34 42 42 33 Z" fill="url(#fox-grad-top)" />

    <!-- Muzzle / Upper Jaw -->
    <path d="M 46 36 C 37 39 32 48 24 59 C 28 62 35 56 42 52 C 48 49 52 48 60 52 C 54 43 49 38 46 36 Z" fill="url(#fox-grad-main)" />

    <!-- Cream / Light Muzzle & Chin -->
    <path d="M 24 59 C 20 64 24 66 29 65 C 37 62 44 55 51 67 C 47 58 40 53 29 55 C 26 56 24 58 24 59 Z" fill="url(#fox-grad-chest)" />

    <!-- Dark Eye Slit -->
    <path d="M 31 44 C 35 42 38 43 40 46 C 37 46 34 46 31 44 Z" fill="#1f0a02" />

    <!-- Nose Tip -->
    <ellipse cx="19.5" cy="62.5" rx="2.2" ry="1.7" transform="rotate(-15 19.5 62.5)" fill="#2a0d03" />

    <!-- Graceful Lower Swoop (Tail / Neck Sweep) -->
    <path d="M 51 67 C 42 76 34 87 32 95 C 44 90 61 80 71 63 C 79 49 78 36 71 28 C 77 42 74 64 58 76 C 52 80 44 85 37 89 C 44 78 49 70 51 67 Z" fill="url(#fox-grad-swoop)" />
  </g>
</svg>